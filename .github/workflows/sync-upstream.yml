name: Sync Upstream

on:
  schedule:
    # Run daily after the weekly promotion refresh window.
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master

      - name: Merge upstream master
        env:
          UPSTREAM_REPOSITORY: https://github.com/Ronchy2000/epic-freebies-helper.git
          TARGET_BRANCH: master
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_REPOSITORY"
          git fetch --no-tags upstream "$TARGET_BRANCH"

          current_sha="$(git rev-parse HEAD)"
          upstream_sha="$(git rev-parse "upstream/$TARGET_BRANCH")"

          if [[ "$current_sha" == "$upstream_sha" ]]; then
            echo "Fork is already at upstream $upstream_sha"
            exit 0
          fi

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "Upstream is already included in fork history"
            exit 0
          fi

          if git merge-base --is-ancestor HEAD "$upstream_sha"; then
            git merge --ff-only "upstream/$TARGET_BRANCH"
          else
            # Preserve fork-only files, but stop on any real conflict instead of
            # silently overwriting a local change.
            git merge --no-edit --no-ff "upstream/$TARGET_BRANCH"
          fi

          git push origin "HEAD:$TARGET_BRANCH"
